version: 2.1

jobs:
  IoUringSqpoll:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Restore vendored sources
          command: tar xzf egg.tgz
      - run:
          name: Provision build deps
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Size rings
          command: |
            printf 'entries=4096\n' > ring.conf
      - run:
          name: Build async io layer
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target IoUringSqpoll -j2
      - run:
          name: Poll submission queue
          command: LIONSS_LP=1 ./build/IoUringSqpoll --conf ring.conf --depth 256
  unwind-fp:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Fetch fixtures
          command: tar xzf egg.tgz
      - run:
          name: Install prerequisites
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load frames
          command: |
            printf 'frames 32\n' > unwind.cfg
      - run:
          name: Build unwinder
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target unwind-fp -j2
      - run:
          name: Walk frame pointers
          command: LIONSS_LP=1 ./build/unwind-fp --conf unwind.cfg --max 256
  Cindersmith:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Sync asset bundles
          command: tar xzf egg.tgz
      - run:
          name: Provision compiler
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load forge
          command: |
            printf 'coals 200\n' > cinder.cfg
      - run:
          name: Build forge sim
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target Cindersmith -j2
      - run:
          name: Stoke cindersmith fire
          command: LIONSS_LP=1 ./build/Cindersmith --config cinder.cfg --bellows 3
  BrambleCreek:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Unpack toolkit
          command: tar xzf egg.tgz
      - run:
          name: Install toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Load watershed
          command: |
            printf 'streams 6\n' > creek.cfg
      - run:
          name: Build flow network
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target BrambleCreek -j2
      - run:
          name: Route bramblecreek
          command: LIONSS_LP=1 ./build/BrambleCreek --config creek.cfg --rain 20
  quokka7:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - checkout
      - run:
          name: Prepare
          command: sudo sysctl -w vm.nr_hugepages=1536 || true
      - run:
          name: Hydrate workspace
          command: tar xzf egg.tgz
      - run:
          name: Bootstrap toolchain
          command: sudo apt-get update && sudo apt-get install -y cmake g++
      - run:
          name: Write topology
          command: |
            printf 'nodes = 7\n' > topo.cfg
      - run:
          name: Build cluster agent
          command: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --target quokka7 -j2
      - run:
          name: Rebalance shards
          command: LIONSS_LP=1 ./build/quokka7 --topo topo.cfg --rf 3
  beamSearch4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
